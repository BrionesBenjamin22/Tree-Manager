name: CI

on:
  pull_request:
    branches:
      - main
      - dev

  push:
    branches:
      - main
      - dev

jobs:
  build-and-validate:
    name: Build and validate API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore tree-manager.slnx

      - name: Build solution
        run: dotnet build tree-manager.slnx --configuration Release --no-restore

      - name: Build Docker image
        run: docker build -t tree-manager-api:ci -f docker/Dockerfile .

      - name: Run tests
        run: dotnet test tree-manager.slnx --configuration Release --no-build